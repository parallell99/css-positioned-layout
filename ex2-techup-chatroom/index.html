<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <div class="chat-app">
    <header class="chat-header">Techup Chatroom</header>

    <section class="chat-window">
      <div class="messages">
        <!-- right / outgoing messages with tail -->
        <div class="message message--right">
          <div class="bubble bubble--green">สวัสดีค่า</div>
        </div>

        <div class="message message--right">
            <div class="bubble bubble--light small">Coding สนุกจังเลย</div>
            <button class="remove remove--right">x</button>
        </div>

        <div class="message message--right">
          <div class="bubble bubble--green small">😍 😍</div>
        </div>

                <!-- left / incoming message with positioned close button -->
        <div class="message message--left">
          <div class="bubble">😍</div>
        </div>

        <div class="message message--left">
          <div class="bubble">😅</div>
        </div>
      </div>
    </section>
  </div>
</body>

</html>
