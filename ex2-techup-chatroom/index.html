<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
   <div class="frame">
    <header class="header">
      <h1 class="title">Techup Chatroom</h1>
    </header>

    <main class="chat-container">
      <!-- Left side pills -->
      <div class="left-section">
        <div class="pill">😍</div>
        <div class="pill">🍪</div>
      </div>

      <!-- Right side messages -->
      <div class="right-section">
        <!-- First message with avatar -->
        <div class="message-group">
          <div class="avatar"></div>
          <div class="bubble green">สวัสดีค้า</div>
        </div>

        <!-- Second message with X button -->
        <div class="message-group">
          <div class="bubble grey has-close">Coding อยากคุย</div>
        </div>

        <!-- Third message with emoji -->
        <div class="message-group">
          <div class="avatar"></div>
          <div class="bubble green">😄 😍</div>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
