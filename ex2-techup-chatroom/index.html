<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <!-- Start coding here -->
  <header class="chat-header">
    <h1>Techup Chatroom</h1>
  </header>

  <div class="chat-container">

    <div class="message-row right">
      <div class="bubble bubble-green with-tail">
        สวัสดีจ้า
      </div>
    </div>

    <div class="message-row right">
      <div class="bubble bubble-light-grey">
        Coding สนุกจังเลย
        <span class="close-btn">x</span>
      </div>
    </div>

    <div class="message-row right">
      <div class="bubble bubble-green with-tail">
        😍 😝
      </div>
    </div>

    <div class="spacer"></div>

    <div class="message-row left">
      <div class="bubble bubble-dark-grey">
        😍
      </div>
    </div>

    <div class="message-row left">
      <div class="bubble bubble-dark-grey">
        🐥
      </div>
    </div>

  </div>

</body>

</html>
